name: Android APKs

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build the four side apps
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: Build all APKs
        run: bash android/build.sh

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: safaridrive-apks
          path: android/out/*.apk
          if-no-files-found: error

      # Free distribution: publish every version tag as a GitHub Release.
      # Users install directly from:
      #   https://github.com/sammyhired/safaridrive/releases
      # APKs download without a GitHub account.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: android/out/*.apk
